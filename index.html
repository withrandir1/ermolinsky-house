.room:hover .fill{fill-opacity:.22}
.room.sel .fill{fill-opacity:.32}

.dash{stroke-dasharray:6 5}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}

/* ---------- Отрисовка ---------- */
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function furn(g){
  return{
    rect(x,y,w,h,cls=''){el('rect',{x,y,width:w,height:h,rx:2,class:'fur '+cls},g)},
    circle(x,y,r,cls=''){el('circle',{cx:x,cy:y,r,class:'fur '+cls},g)},
    line(x1,y1,x2,y2,w=1.3,cls=''){el('line',{x1,y1,x2,y2,class:'fur '+cls,'stroke-width':w},g)},
    path(d,dash){el('path',{d,class:'fur'+(dash?' dash':'')},g)},
    text(x,y,t,s=13,rot){if(!t)return;const e=el('text',{x,y,class:'lbl2','font-size':s},g);if(rot)e.setAttribute('transform',`rotate(${rot} ${x} ${y})`);e.textContent=t;},
    out(x,y,t){const e=el('text',{x,y,class:'outlbl'},g);e.textContent=t;}
  };
}

  for(const [o,y,t,x1,x2] of F.windows){el('rect',{x:x1,y,width:x2-x1,height:t,fill:'var(--bg)'},svg);
    for(const k of [.38,.62]) el('line',{x1,y1:y+t*k,x2,y2:y+t*k,stroke:'var(--wall)','stroke-width':1.2},svg);
    el('line',{x1,y1:y,x2:x1,y2:y+t,stroke:'var(--wall)','stroke-width':1.5},svg);el('line',{x1:x2,y1:y,x2,y2:y+t,stroke:'var(--wall)','stroke-width':1.5},svg);}
  // комнаты
  const roomsG=el('g',{},svg);
  for(const r of F.rooms){
    const [x,y,w,h]=r.r, key=r.part||r.id;
    const g=el('g',{class:'room'+(sel===key?' sel':''),'data-id':key},roomsG);
    if(r.yard){el('rect',{x:x-20,y:y-15,width:w+40,height:h+35,fill:'none',stroke:'var(--wall)','stroke-width':1.5,'stroke-dasharray':'10 6'},g);}
    el('rect',{x,y,width:w,height:h,fill:'var(--bg)',stroke:r.yard?'none':'var(--wall)','stroke-width':1.6},g);
    el('rect',{x,y,width:w,height:h,class:'fill',fill:COLORS[r.cat],'fill-opacity':r.cat==='service'?.05:.12},g);
    g.addEventListener('click',()=>{sel=key;draw();showInfo(key);});
  }
  // проёмы и простенки
  for(const [x,y,w,h] of (F.openings||[])) if(w&&h) el('rect',{x,y,width:w,height:h,fill:'var(--bg)'},svg);
  for(const [x,y,w,h] of (F.piers||[])) el('rect',{x,y,width:w,height:h,fill:'url(#hatch)',stroke:'var(--wall)','stroke-width':1.5},svg);
  // лестницы
  for(const r of F.rooms){ if(!r.stair) continue; const [x,y,w,h]=r.r; const g=el('g',{},svg);
    if(r.stair==='main'){for(let i=0;i<9;i++) el('line',{x1:x+42,y1:y+80+i*18,x2:x+122,y2:y+80+i*18,class:'fur'},g); el('rect',{x:x+42,y:y+80,width:80,height:162,class:'fur'},g);}
    else {const n=Math.floor((h-30)/16); for(let i=0;i<n;i++) el('line',{x1:x+10,y1:y+15+i*16,x2:x+w-10,y2:y+15+i*16,class:'fur'},g); el('line',{x1:x+w/2,y1:y+15,x2:x+w/2,y2:y+h-15,class:'fur'},g);}
  }
  // мебель
  const fg=el('g',{},svg); window[F.extra](fg,mode[floor]);
  // подписи
  for(const r of F.rooms){ if(!r.name) continue; const [x,y,w,h]=r.r; const cx=x+w/2, cy=r.ly||y+h/2;
    const t=el('text',{x:cx,y:cy,class:'lbl','font-size':r.fs||20},svg); t.textContent=r.name;
    if(r.vert){t.setAttribute('transform',`rotate(-90 ${cx} ${cy})`);}
    if(r.s&&!r.vert){const s=el('text',{x:cx,y:cy+Math.max(16,(r.fs||20)*.85),class:'lbl2','font-size':Math.max(11,(r.fs||20)*.55)},svg);s.textContent=r.s;}
  }
  document.getElementById('floorNote').textContent=F.note;
  // режимы
  const m=document.getElementById('modes'); m.innerHTML='';
  const info=document.createElement('span'); info.textContent=`${F.site} · ${F.h}`; info.style.marginRight='10px'; m.appendChild(info);
  for(const [k,t] of (MODES[floor]||[])){const b=document.createElement('button');b.textContent=t;b.className=mode[floor]===k?'on':'';b.onclick=()=>{mode[floor]=k;draw();};m.appendChild(b);}
}

function showInfo(id){
  const a=document.getElementById('info'); const r=Object.values(FLOORS).flatMap(f=>f.rooms).find(r=>(r.part||r.id)===id&&!r.part)||{};
  const d=INFO[id];
  a.classList.toggle('sheet',matchMedia('(max-width:900px)').matches); a.scrollTop=0;
  const x='<button class="close" aria-label="Закрыть" onclick="sel=null;draw();intro()">×</button>';
  if(!d){a.innerHTML=`${x}<h2>${r.name||'—'}</h2><p class="meta">${r.s||''}</p><p>Сервисное помещение.</p>`;return;}
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:'';
  a.innerHTML=`${x}<span class="tag" style="color:${COLORS[d.tag]}">${CAT[d.tag]}</span><h2>${r.name}</h2><p class="meta">${r.s||''}</p>
  <p>${d.what}</p>${d.invite?`<p><b style="color:var(--ink)">Вход по знакомству.</b> ${d.invite}</p>`:''}
  ${d.verdict?`<p><b style="color:var(--ink)">Делать ли.</b> ${d.verdict}</p>`:''}
  <dl>${row('Вместимость',d.cap)}${row('Цены',d.sale)}${row('Деньги',d.money)}${row('Вложения',d.capex)}${row('Рынок',d.market)}</dl>`;
}
function intro(){
  document.getElementById('info').classList.remove('sheet');
  document.getElementById('info').innerHTML=`<h2>Как читать план</h2>
  <p>Нажмите на комнату, чтобы увидеть, что в ней, на сколько человек, сколько она приносит и сколько стоит её обставить.</p>
  <p><b style="color:var(--ink)">Главное.</b> Дом не ждёт клиентов, а живёт каждый день. Внизу кино и вечеринки, на парадном этаже события, выставка, бильярд, бар и игры, наверху этаж подписки «Резиденция» и спальня посла.</p>
  <p><b style="color:var(--ink)">Важная находка.</b> На сайте оператора «Этаж 1» — это цоколь по БТИ, а «Этаж 2» — 1-й этаж по БТИ. Верхний этаж (около 400 м² бывших апартаментов) на сайте не показан и, по-видимому, не используется. Это наш главный резерв площади.</p>
  <p>Мебель — от шоурумов, книги — от букинистов, пластинки — от дилеров: всё стоит у нас и продаётся. Вкладываем свои деньги только в технику, свет и то, что изнашивается.</p>`;
}

/* ---------- Деньги ---------- */
const Z=[ // зона, выручка и вклад: осторожный/база/хороший, вложения
['Аренда зала под события (4 в месяц × 300 тыс.)',[.72,1.20,1.56],[.72,1.20,1.56],0],
['Выставка по приглашениям (20 дней × 40 гостей)',[1.22,2.04,2.65],[.60,1.16,1.58],.6],
['Кинозал в цоколе (12 показов + частные + 2 вечеринки)',[.90,1.50,1.95],[.34,.72,1.01],4.2],
['Подписка «Резиденция» (100 × 15 тыс. + 30 × 35 тыс.)',[1.53,2.55,3.31],[.98,1.86,2.53],3.8],
['Бильярдная Solids (60 ч × 3 000 ₽)',[.11,.18,.23],[.09,.15,.20],1.5],
['Игральный зал (8 мастер-классов + 4 турнира)',[.43,.72,.94],[.23,.44,.59],.35],
['Иммерсивные ужины (3 × 80 гостей + 4 × 24)',[2.85,4.75,6.18],[.73,1.22,1.59],.5],
['VIP-комнаты (30 броней × 4 ч × 5 000 ₽)',[.36,.60,.78],[.29,.48,.62],.9],
['Спальня посла (8 ночей × 45 тыс.)',[.22,.36,.47],[.17,.28,.36],.5],
['Бар: пробковый сбор и ячейки',[.29,.48,.62],[.24,.41,.53],1.0]];
const FIX=3.94;
function money(){
  const s=document.getElementById('money');
  const sum=i=>Z.reduce((a,z)=>a+z[2][i],0), rev=i=>Z.reduce((a,z)=>a+z[1][i],0), cap=Z.reduce((a,z)=>a+z[3],0);
  const f=v=>v.toFixed(2).replace('.',',');
  s.innerHTML=`<h3>Закрываем аренду каждый месяц, а не от случая к случаю</h3>
  <div class="cards">
   <div class="card"><b>${f(FIX)}</b><span>млн ₽ в месяц — все постоянные расходы дома: аренда 2,0, коммуналка 0,3, ядро команды 1,39, прочее 0,25</span></div>
   <div class="card"><b>${f(sum(1))}</b><span>млн ₽ в месяц остаётся со всех зон в базовом сценарии (через ~6 месяцев)</span></div>
   <div class="card"><b class="pos">+${f(sum(1)-FIX)}</b><span>млн ₽ в месяц прибыль до налога в базе; в осторожном сценарии +${f(sum(0)-FIX)}</span></div>
   <div class="card"><b>${f(cap)}</b><span>млн ₽ вложений во все зоны; окупаются за ~3–4 месяца базовой работы</span></div>
  </div>
  <div class="scroll"><table><thead><tr><th>Зона</th><th>Выручка, база</th><th>Остаётся: осторожно</th><th>база</th><th>хорошо</th><th>Вложения</th></tr></thead><tbody>
  ${Z.map(z=>`<tr><td>${z[0]}</td><td>${f(z[1][1])}</td><td>${f(z[2][0])}</td><td>${f(z[2][1])}</td><td>${f(z[2][2])}</td><td>${z[3]?f(z[3]):'—'}</td></tr>`).join('')}
  <tr class="tot"><td>Итого по зонам</td><td>${f(rev(1))}</td><td>${f(sum(0))}</td><td>${f(sum(1))}</td><td>${f(sum(2))}</td><td>${f(cap)}</td></tr>
  <tr><td>Минус постоянные расходы</td><td></td><td>−${f(FIX)}</td><td>−${f(FIX)}</td><td>−${f(FIX)}</td><td></td></tr>
  <tr class="tot"><td>Прибыль до налога в месяц</td><td></td><td class="pos">+${f(sum(0)-FIX)}</td><td class="pos">+${f(sum(1)-FIX)}</td><td class="pos">+${f(sum(2)-FIX)}</td><td></td></tr>
  </tbody></table></div>
  <p>Все цифры — оценки в млн ₽ в месяц. «Остаётся» — выручка минус еда, напитки, эквайринг и персонал самой зоны. Осторожный сценарий — 60% объёмов, хороший — 130%.</p>
  <h3>Что из этого следует</h3>
  <ul>
   <li><b>Аренду закрывают три постоянные кассы:</b> события в зале (~1,2), выставка (~1,16) и подписка (~1,86). Вместе это 4,2 млн, больше всех постоянных расходов.</li>
   <li><b>На старте не хватает 0,36 млн в месяц.</b> События, выставка и ужины дают 3,58 против 3,94. Разрыв закрывает первая сотня подписчиков, поэтому подписку продаём с первого дня выставки.</li>
   <li><b>Бильярд, винил и библиотека сами по себе почти не зарабатывают.</b> Они — причина купить подписку. Считать их отдельно правильно, но решение по ним принимать вместе с подпиской.</li>
   <li><b>Кинозал окупается за ~6 месяцев полный и за ~2 месяца лёгкий.</b> Начинаем с лёгкого: портативные проекторы и диваны, без полной шумоизоляции. Полный — когда показы заполнены на 75%.</li>
   <li><b>Продажа вещей</b> (мебель, столы, пластинки, книги) в расчёт не входит. Это плюс сверху: с второго сезона 10–15% комиссии.</li>
  </ul>
  <h3>Подписка «Резиденция»</h3>
  <ul>
   <li><b>«Резидент» — 15 000 ₽/мес:</b> верхний этаж каждый день, библиотека, винил-салон, гостиная, кофе и чай, бар на пробковом сборе, приоритет на ужины и балы, 1 гость в месяц.</li>
   <li><b>«Резидент+» — 35 000 ₽/мес:</b> плюс бильярд и игральный зал без почасовой платы, 4 часа VIP-комнаты в месяц, именная ячейка и набор, 3 гостя.</li>
   <li>Ориентир: годовой взнос «Атлантов» — 750 тыс. ₽, фитнес в Петербурге — от 5,7 тыс. в месяц. «Резидент» за год — 180 тыс.: дешевле бизнес-клуба, дороже фитнеса.</li>
  </ul>
  <h3>Не проверено</h3>
  <p>Ставки персонала, коммуналка, цены закупок — оценки до коммерческих предложений. Пожарная вместимость цоколя и верхнего этажа. Юрист: билеты и спальня при назначении «офис», пробковый сбор без лицензии, права на показ фильмов. Свободен ли верхний этаж и входит ли он в аренду.</p>`;
}

/* ---------- Вкладки ---------- */
const TABS=[['cokol','Цоколь'],['paradny','Парадный этаж'],['upper','Верхний этаж'],['money','Деньги']];
function tabs(){
  const n=document.getElementById('tabs'); n.innerHTML='';
  for(const [k,t] of TABS){const b=document.createElement('button');b.textContent=t;b.className=(k==='money'?!document.getElementById('money').hidden:floor===k&&document.getElementById('money').hidden)?'on':'';
    b.onclick=()=>{const m=document.getElementById('money'),mn=document.getElementById('main');
      if(k==='money'){m.hidden=false;mn.hidden=true;money();}else{m.hidden=true;mn.hidden=false;floor=k;sel=null;draw();intro();}
      tabs();};n.appendChild(b);}
}
tabs(); draw(); intro();
</script>
